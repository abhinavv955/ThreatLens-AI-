<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shieldGrad" x1="6" y1="4" x2="42" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="lensGrad" x1="16" y1="16" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Subtle Shield Contour -->
  <path d="M24 4L39 9.5V22C39 31.5 32.5 39.8 24 43C15.5 39.8 9 31.5 9 22V9.5L24 4Z" 
        stroke="url(#shieldGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85" />

  <!-- Outer Network Nodes & Interconnecting Lines -->
  <circle cx="24" cy="11" r="2.2" fill="#38BDF8" filter="url(#glow)" />
  <circle cx="34" cy="22" r="2.2" fill="#8B5CF6" filter="url(#glow)" />
  <circle cx="14" cy="22" r="2.2" fill="#8B5CF6" filter="url(#glow)" />
  <circle cx="24" cy="35" r="2.2" fill="#38BDF8" filter="url(#glow)" />

  <line x1="24" y1="11" x2="34" y2="22" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.2" stroke-dasharray="2 2" />
  <line x1="34" y1="22" x2="24" y2="35" stroke="rgba(139, 92, 246, 0.4)" stroke-width="1.2" stroke-dasharray="2 2" />
  <line x1="24" y1="35" x2="14" y2="22" stroke="rgba(139, 92, 246, 0.4)" stroke-width="1.2" stroke-dasharray="2 2" />
  <line x1="14" y1="22" x2="24" y2="11" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.2" stroke-dasharray="2 2" />

  <!-- Inner Analytical Lens (Concentric Aperture) -->
  <circle cx="24" cy="23" r="7.5" stroke="#38BDF8" stroke-width="1.8" fill="rgba(14, 22, 38, 0.8)" />
  <!-- Core Pupil Node -->
  <circle cx="24" cy="23" r="3.2" fill="url(#lensGrad)" filter="url(#glow)" />
</svg>
